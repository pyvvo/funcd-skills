name: refresh

# The docs site changes with each funcd release: regenerate the index and the references from it, and open a pull
# request when they changed.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate from the docs site
        run: python3 scripts/generate.py && python3 scripts/check.py
      - name: Open a pull request when the docs changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The docs did not change."
            exit 0
          fi
          release=$(sed -n 's/^  docs-release: "\(.*\)"$/\1/p' skills/funcd/SKILL.md)
          branch="refresh/docs-${release}-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A && git commit -m "docs: regenerate the funcd skill from the docs of ${release}"
          git push origin "$branch"
          gh pr create --title "docs: regenerate the funcd skill from the docs of ${release}" \
            --body "Regenerated by the refresh workflow from https://pyvvo.github.io/funcd/llms.txt."
